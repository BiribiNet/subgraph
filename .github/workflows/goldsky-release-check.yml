name: Check or promote isolated Goldsky release
run-name: Goldsky ${{ inputs.operation }} ${{ inputs.network }} ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, validate, promote, restore-testnet]
        default: inspect
        required: true
      network:
        type: choice
        options: [mainnet, testnet]
        default: mainnet
        required: true
      version:
        description: Explicit immutable candidate version
        required: true
      expected_live_version:
        description: Observed current prod version; required for validate/promote
        required: false
      credential_environment:
        description: Location of the BRB project admin credential, independent of chain
        type: choice
        options: [goldsky-testnet, goldsky-mainnet]
        default: goldsky-testnet
        required: true
permissions:
  contents: read
concurrency:
  group: goldsky-${{ inputs.network }}-release
  cancel-in-progress: false
jobs:
  verify:
    environment: ${{ inputs.credential_environment == 'goldsky-mainnet' && 'goldsky-mainnet' || 'goldsky-testnet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/goldsky-release-check.test.mjs scripts/goldsky-private-endpoint.test.mjs scripts/goldsky-promote.test.mjs
      - name: Inspect or validate the selected network and version
        env:
          GOLDSKY_API_TOKEN: ${{ secrets.GOLDSKY_API_TOKEN || secrets.GOLDSKY_TOKEN }}
          RELEASE_NETWORK: ${{ inputs.network }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          VERSION: ${{ inputs.version }}
          EXPECTED_LIVE_VERSION: ${{ inputs.expected_live_version }}
        run: node scripts/goldsky-release-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldsky-release-status
          path: goldsky-release-status.json
          if-no-files-found: warn
