name: Reconcile indexed evidence
on:
  workflow_dispatch:
    inputs:
      subgraph_url:
        description: Public GraphQL endpoint to validate
        required: true
        default: https://biribi.net/api/subgraph
      round:
        description: Round number to verify
        required: true
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUBGRAPH_URL: ${{ inputs.subgraph_url }}
      ROUND: ${{ inputs.round }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/reconcile-vaults.mjs
      - run: node scripts/round-evidence.mjs "$ROUND" > round-evidence.json
      - run: node scripts/verify-round-evidence.mjs round-evidence.json > transfer-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: round-evidence
          path: |
            round-evidence.json
            transfer-verification.json
