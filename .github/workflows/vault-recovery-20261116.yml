name: Validate and activate the Arbitrum One vault recovery
on:
  push:
    tags: [ops/vault-recovery-promote-20261116-checkpoint]
permissions:
  contents: read
concurrency:
  group: goldsky-mainnet-release
  cancel-in-progress: false
jobs:
  cutover:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    environment: goldsky-testnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the candidate and activate it for production
        env:
          GOLDSKY_API_TOKEN: ${{ secrets.GOLDSKY_API_TOKEN || secrets.GOLDSKY_TOKEN }}
        run: node scripts/recover-mainnet-vault-20261116.mjs
