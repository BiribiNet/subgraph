name: Stage testnet subgraph in BRB project
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit immutable version; deploys untagged and retains rollback"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: goldsky-testnet-release
  cancel-in-progress: false
jobs:
  deploy:
    environment: goldsky-testnet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && yarn install --immutable
      - run: yarn test:release && yarn test
      - name: Submit testnet candidate without promotion or deletion
        env:
          GOLDSKY_API_TOKEN: ${{ secrets.GOLDSKY_API_TOKEN || secrets.GOLDSKY_TOKEN }}
          GOLDSKY_SUBGRAPH_NAME: biribi
          VERSION: ${{ inputs.version }}
          PRUNE: "0"
        run: node scripts/goldsky-release.mjs
