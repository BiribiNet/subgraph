name: Stage isolated Goldsky release in BRB project
run-name: Goldsky ${{ inputs.operation || 'deploy' }} ${{ inputs.network || 'testnet' }} ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a candidate, inspect, validate, promote, or restore a missing Sepolia alias
        required: true
        type: choice
        options: [deploy, inspect, validate, promote, restore-testnet]
        default: deploy
      network:
        description: "Explicit chain: mainnet uses the verified isolated ABI profile"
        required: true
        type: choice
        options: [testnet, mainnet]
        default: testnet
      credential_environment:
        description: "Location of the BRB project admin key; does not select the chain"
        required: true
        type: choice
        options: [goldsky-testnet, goldsky-mainnet]
        default: goldsky-testnet
      version:
        description: "Explicit immutable version; deploys untagged and retains rollback"
        required: true
        type: string
      expected_live_version:
        description: Observed current prod version; required for validate/promote
        required: false
permissions:
  contents: read
concurrency:
  group: goldsky-${{ inputs.network || 'testnet' }}-release
  cancel-in-progress: false
jobs:
  deploy:
    # The existing BRB-project admin credential lives under this legacy name.
    # Network selection and build guards independently bind the deployment chain.
    # Runtime query/mirror/Ably credentials remain environment-specific.
    environment: ${{ inputs.credential_environment == 'goldsky-mainnet' && 'goldsky-mainnet' || 'goldsky-testnet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployment credential before installing or building
        env:
          GOLDSKY_API_TOKEN: ${{ secrets.GOLDSKY_API_TOKEN || secrets.GOLDSKY_TOKEN }}
        run: node --input-type=module -e "import { goldskyToken, verifyBrbProject } from './scripts/goldsky-project.mjs'; await verifyBrbProject(goldskyToken());"
      - name: Validate explicit network and immutable version
        env:
          RELEASE_NETWORK: ${{ inputs.network || 'testnet' }}
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e "import { validateReleaseTarget } from './scripts/goldsky-project.mjs'; const n=process.env.RELEASE_NETWORK; if (!['mainnet','testnet'].includes(n)) throw Error('Invalid network'); validateReleaseTarget(n==='mainnet'?'biribi-arbitrum-one':'biribi',process.env.VERSION);"
      - name: Check release safeguards
        run: node --test scripts/goldsky-release-check.test.mjs scripts/goldsky-private-endpoint.test.mjs scripts/goldsky-promote.test.mjs
      - run: corepack enable && yarn install --immutable
        if: inputs.operation == 'deploy' || inputs.operation == ''
      - run: yarn test:release && yarn codegen && yarn test
        if: inputs.operation == 'deploy' || inputs.operation == ''
      - name: Prepare and compile isolated mainnet candidate
        if: inputs.network == 'mainnet' && (inputs.operation == 'deploy' || inputs.operation == '')
        run: |
          node scripts/prepare-environment.mjs deployments/arbitrum-one.json release-mainnet
          cd release-mainnet
          ../node_modules/.bin/graph codegen
          ../node_modules/.bin/graph build
      - name: Submit candidate without promotion or deletion
        if: inputs.operation == 'deploy' || inputs.operation == ''
        env:
          GOLDSKY_API_TOKEN: ${{ secrets.GOLDSKY_API_TOKEN || secrets.GOLDSKY_TOKEN }}
          RELEASE_NETWORK: ${{ inputs.network || 'testnet' }}
          VERSION: ${{ inputs.version }}
          PRUNE: "0"
        run: |
          if [ "$RELEASE_NETWORK" = mainnet ]; then
            GOLDSKY_BUILD_DIR=release-mainnet/build node scripts/goldsky-deploy.mjs "biribi-arbitrum-one/$VERSION"
          else
            node scripts/goldsky-release.mjs
          fi
      - name: Inspect or validate the selected release
        if: inputs.operation != 'deploy' && inputs.operation != ''
        env:
          GOLDSKY_API_TOKEN: ${{ secrets.GOLDSKY_API_TOKEN || secrets.GOLDSKY_TOKEN }}
          RELEASE_NETWORK: ${{ inputs.network || 'testnet' }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          VERSION: ${{ inputs.version }}
          EXPECTED_LIVE_VERSION: ${{ inputs.expected_live_version }}
        run: node scripts/goldsky-release-check.mjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.operation != 'deploy' && inputs.operation != ''
        with:
          name: goldsky-release-status
          path: goldsky-release-status.json
          if-no-files-found: warn
