name: Stage accounting validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goldsky-validation
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable && yarn install --immutable
      - run: yarn codegen && yarn test && yarn build
      - name: Deploy separate validation version
        env:
          GOLDSKY_API_TOKEN: ${{ secrets.GOLDSKY_API_TOKEN || secrets.GOLDSKY_TOKEN }}
        run: node scripts/goldsky-stage.mjs biribi validation-${{ github.run_id }}-${{ github.run_attempt }}
