name: CI
permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # Matchstick 0.6.0 ships a Linux 22 binary; graph-cli rejects Ubuntu 26.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Verify staging safeguards without credentials
        run: yarn test:release

      - name: Verify tip manifest activation safeguards
        run: node --test scripts/configure-tips.test.mjs

      - name: Generate types
        run: yarn codegen

      - name: Check constants + matchstick tests
        run: yarn test

      - name: Build subgraph
        run: yarn build
